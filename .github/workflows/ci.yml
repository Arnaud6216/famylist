name: CI

on:
  push:
    branches: [ main, preprod ]
  pull_request:
    branches: [ main, preprod ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (PHP 8.4)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: famylist_user
          POSTGRES_PASSWORD: famylist_password
          POSTGRES_DB: famylist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: "postgresql://famylist_user:famylist_password@127.0.0.1:5432/famylist?serverVersion=17&charset=utf8"
      APP_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, intl, zip, opcache
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Check PHP coding standards (PHP-CS-Fixer)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Run PHPStan static analysis
        run: vendor/bin/phpstan analyse --no-progress

      - name: Validate Doctrine mapping metadata
        run: php bin/console doctrine:schema:validate --skip-sync

      - name: Create database if not exists (Test DB)
        run: php bin/console doctrine:database:create --if-not-exists --env=test

      - name: Run database migrations (Test DB)
        run: php bin/console doctrine:migrations:migrate --no-interaction --env=test

      - name: Run automated tests (PHPUnit)
        run: bin/phpunit

  frontend:
    name: Frontend (Vue 3 / TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check (TypeScript)
        run: npm run type-check

      - name: Lint check (ESLint)
        run: npm run lint:check

      - name: Run unit and component tests (Vitest)
        run: npm run test

      - name: Build production bundle
        run: npm run build
